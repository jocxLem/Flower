<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>3D Flower, CSS + JS</title>
  <link rel="stylesheet" href="https://public.codepenassets.com/css/reset-2.0.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="main-content">
  <div class="container" id="start-btn-container">
    <button id="start-btn" class="button" type="button"></button>
  </div>
  <audio id="bg-music" src="musica/Tokio%20Hotel%20-%20How%20to%20Love%20(Official%20Lyric%20Music%20Video).mp3" preload="auto" playsinline></audio>
  <button id="music-toggle" class="music-toggle" type="button" aria-label="Reproducir o pausar música" style="display:none;">🔊</button>
  <canvas id="galaxy-canvas" style="display:none;"></canvas>
  <div class="wrapper" style="display:none;">
    <div class="flower"></div>
  </div>
  <div class="flower-message" style="display:none;" aria-live="polite">
    <span class="flower-message-text"></span>
  </div>
</div>
<script src="js/main.js" defer></script>
</body>
</html>
